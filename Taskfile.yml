version: "3"

silent: true

vars:
  WORKSPACE_TOOL: ./tools/go-workspace.sh
  PROTOBUF_TOOL: ./tools/protobuf.sh
  INFRA_TOOL: ./infra/compose/scripts/local.sh
  E2E_TOPOLOGY_TOOL: go run ./tools/e2e-topology

tasks:
  default:
    desc: Показать доступные задачи
    cmds:
      - task --list

  hooks:install:
    desc: Подключить репозиторные Git hooks
    preconditions:
      - sh: test -x .githooks/pre-commit
        msg: Не найден исполняемый .githooks/pre-commit
    cmds:
      - |
        configured_path="$(git config --local --get core.hooksPath || true)"
        if [ -n "${configured_path}" ] && [ "${configured_path}" != ".githooks" ]; then
          printf 'core.hooksPath уже настроен: %s\n' "${configured_path}" >&2
          printf '%s\n' 'Удалите или перенесите существующие hooks перед установкой.' >&2
          exit 1
        fi
        git config --local core.hooksPath .githooks
        printf '%s\n' 'Git hooks подключены из .githooks.'

  fmt:
    desc: Отформатировать Go-код во всех модулях
    cmds:
      - "{{.WORKSPACE_TOOL}} fmt"

  fmt-check:
    desc: Проверить форматирование Go-кода
    cmds:
      - "{{.WORKSPACE_TOOL}} fmt-check"

  vet:
    desc: Выполнить go vet во всех модулях
    cmds:
      - "{{.WORKSPACE_TOOL}} vet"

  test:
    desc: Выполнить тесты во всех модулях
    cmds:
      - "{{.WORKSPACE_TOOL}} test"

  test-race:
    desc: Выполнить тесты с race detector во всех модулях
    cmds:
      - "{{.WORKSPACE_TOOL}} test-race"

  build:
    desc: Собрать все Go-пакеты во всех модулях
    cmds:
      - "{{.WORKSPACE_TOOL}} build"

  arch:
    desc: Проверить workspace и архитектурные зависимости
    cmds:
      - "{{.WORKSPACE_TOOL}} arch"

  api:bootstrap:
    desc: Установить зафиксированные protobuf-инструменты в корневой bin
    cmds:
      - "{{.PROTOBUF_TOOL}} bootstrap"

  api:versions:
    desc: Показать фактические версии protobuf-инструментов
    cmds:
      - "{{.PROTOBUF_TOOL}} versions"

  api:config:
    desc: Проверить easyp.yaml
    cmds:
      - "{{.PROTOBUF_TOOL}} config"

  api:deps:
    desc: Скачать protobuf-зависимости строго по easyp.lock
    cmds:
      - "{{.PROTOBUF_TOOL}} deps"

  api:deps:update:
    desc: Обновить protobuf-зависимости и easyp.lock
    cmds:
      - "{{.PROTOBUF_TOOL}} deps-update"

  api:lint:
    desc: Проверить protobuf-схемы с помощью EasyP
    cmds:
      - "{{.PROTOBUF_TOOL}} lint"

  api:generate:
    desc: Воспроизводимо сгенерировать Go и TypeScript контракты
    cmds:
      - "{{.PROTOBUF_TOOL}} generate"

  api:breaking:
    desc: Проверить protobuf-совместимость относительно dev
    cmds:
      - "{{.PROTOBUF_TOOL}} breaking"

  api:generate-check:
    desc: Проверить актуальность сгенерированных контрактов без изменения рабочего дерева
    cmds:
      - "{{.PROTOBUF_TOOL}} generate-check"

  api:self-test:
    desc: Проверить генераторы, отрицательный lint и breaking change
    cmds:
      - "{{.PROTOBUF_TOOL}} self-test"

  api:verify:
    desc: Выполнить все проверки protobuf toolchain и контрактов
    cmds:
      - task: api:config
      - task: api:deps
      - task: api:lint
      - task: api:breaking
      - task: api:generate-check
      - task: api:self-test

  verify:
    desc: Выполнить обязательные локальные проверки workspace
    cmds:
      - task: api:verify
      - task: fmt-check
      - task: vet
      - task: test-race
      - task: build
      - task: arch

  infra:env:
    desc: Создать локальную конфигурацию инфраструктуры без вывода секретов
    cmds:
      - "{{.INFRA_TOOL}} env"

  infra:config:
    desc: Проверить итоговую Docker Compose конфигурацию
    cmds:
      - "{{.INFRA_TOOL}} config"

  infra:up:
    desc: Запустить локальную инфраструктуру и дождаться готовности
    cmds:
      - "{{.INFRA_TOOL}} up"

  infra:ready:
    desc: Проверить готовность локальной инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} ready"

  infra:smoke:
    desc: Проверить PostgreSQL и сетевую изоляцию DMZ
    cmds:
      - "{{.INFRA_TOOL}} smoke"

  infra:persistence:
    desc: Проверить сохранность данных после обычного restart
    cmds:
      - "{{.INFRA_TOOL}} persistence"

  infra:verify:
    desc: Запустить окружение и выполнить все инфраструктурные проверки
    cmds:
      - "{{.INFRA_TOOL}} verify"

  infra:status:
    desc: Показать состояние контейнеров инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} status"

  infra:logs:
    desc: Следить за логами локальной инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} logs"

  infra:psql-rw:
    desc: Открыть psql через RW endpoint primary
    cmds:
      - "{{.INFRA_TOOL}} psql-rw"

  infra:psql-ro:
    desc: Открыть psql через RO endpoint synchronous replica
    cmds:
      - "{{.INFRA_TOOL}} psql-ro"

  postgres:integration:
    desc: Выполнить интеграционные тесты PostgreSQL против primary и synchronous replica
    cmds:
      - bash platform/postgres/testdata/integration.sh

  redis:integration:
    desc: Выполнить интеграционные тесты независимых edge и auth Redis
    cmds:
      - bash platform/redis/testdata/integration.sh

  auth:integration:
    desc: Выполнить интеграционные тесты PostgreSQL-адаптера Auth
    cmds:
      - bash services/auth/internal/adapter/out/postgres/testdata/integration.sh

  tunnel-e2e:images:
    desc: Собрать локальные immutable-source образы MM-29 без публикации
    cmds:
      - bash e2e/tunnel/scripts/images.sh

  tunnel-e2e:load:
    desc: Импортировать образы MM-29 в containerd всех четырёх VM topology MM-44
    vars:
      TUNNEL_IMAGE_VERSION:
        sh: git rev-parse --short=12 HEAD
    cmds:
      - >-
        {{.E2E_TOPOLOGY_TOOL}} load-images
        --image marketmesh/gateway-in:mm29-{{.TUNNEL_IMAGE_VERSION}}
        --image marketmesh/gateway-out:mm29-{{.TUNNEL_IMAGE_VERSION}}
        --image marketmesh/fake-internal:mm29-{{.TUNNEL_IMAGE_VERSION}}

  tunnel-e2e:deploy:
    desc: Развернуть workloads MM-29 в четырёх явных kubeconfig
    cmds:
      - go run ./e2e/tunnel/cmd/workloadctl deploy {{.CLI_ARGS}}

  tunnel-e2e:inspect:
    desc: Собрать bounded diagnostics workloads MM-29
    cmds:
      - go run ./e2e/tunnel/cmd/workloadctl inspect {{.CLI_ARGS}}

  tunnel-e2e:frontdoor:
    desc: Запустить локальный health-aware front door MM-30 для двух DC
    cmds:
      - go run ./e2e/tunnel/cmd/frontdoor {{.CLI_ARGS}}

  tunnel-e2e:rolling:
    desc: Выполнить bounded rolling redeploy или rollback-матрицу MM-34
    cmds:
      - go run ./e2e/tunnel/cmd/rollingctl {{.CLI_ARGS}}

  tunnel-e2e:undeploy:
    desc: Собрать diagnostics и удалить точные workloads MM-29
    cmds:
      - go run ./e2e/tunnel/cmd/workloadctl undeploy {{.CLI_ARGS}}

  tunnel-e2e:pod-chaos:
    desc: Выполнить последовательный pod kill/redeploy MM-32 под continuous load
    cmds:
      - go run ./e2e/tunnel/cmd/podchaos {{.CLI_ARGS}}

  infra:down:
    desc: Остановить окружение с сохранением данных
    cmds:
      - "{{.INFRA_TOOL}} down"

  infra:clean:
    desc: Остановить окружение и полностью удалить его volumes
    cmds:
      - "{{.INFRA_TOOL}} clean"

  e2e:topology:bootstrap:
    desc: Установить проверенные k3s и kubectl, проверить orbctl и собрать TCP-probe MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} bootstrap"

  e2e:topology:versions:
    desc: Показать зафиксированные версии topology toolchain
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} versions"

  e2e:topology:inventory:
    desc: Показать versioned inventory четырёх кластеров MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} inventory"

  e2e:topology:targets:
    desc: Разрешить или повторно проверить immutable fault targets MM-38
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} targets {{.CLI_ARGS}}"

  e2e:topology:up:
    desc: Создать четыре disposable OrbStack VM с k3s MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} up"

  e2e:topology:ready:
    desc: Проверить готовность и зональную изоляцию topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} ready"

  e2e:topology:inspect:
    desc: Собрать безопасные diagnostics topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} inspect"

  e2e:topology:down:
    desc: Собрать diagnostics и удалить только ресурсы topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} down"

  e2e:topology:verify:
    desc: Дважды проверить полный lifecycle и изоляцию topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} verify"

  observability:config:
    desc: Проверить конфигурации Alloy, Tempo, Loki, HAProxy и Docker Compose
    cmds:
      - "{{.INFRA_TOOL}} observability-config"

  observability:up:
    desc: Запустить локальный observability-стек
    cmds:
      - "{{.INFRA_TOOL}} observability-up"

  observability:ready:
    desc: Проверить health checks локального observability-стека
    cmds:
      - "{{.INFRA_TOOL}} observability-ready"

  observability:smoke:
    desc: Проверить связанные trace и log через Alloy, Tempo, Loki и Grafana
    cmds:
      - "{{.INFRA_TOOL}} observability-smoke"

  observability:outage:
    desc: Проверить bounded queues Alloy при недоступных Tempo и Loki
    cmds:
      - "{{.INFRA_TOOL}} observability-outage"

  observability:persistence:
    desc: Проверить сохранность traces и logs после restart
    cmds:
      - "{{.INFRA_TOOL}} observability-persistence"

  observability:verify:
    desc: Запустить observability-стек и выполнить все его проверки
    cmds:
      - "{{.INFRA_TOOL}} observability-verify"

  observability:status:
    desc: Показать состояние контейнеров observability
    cmds:
      - "{{.INFRA_TOOL}} observability-status"

  observability:logs:
    desc: Следить за логами observability-стека
    cmds:
      - "{{.INFRA_TOOL}} observability-logs"

  observability:down:
    desc: Остановить observability-стек с сохранением данных
    cmds:
      - "{{.INFRA_TOOL}} observability-down"

  observability:clean:
    desc: Удалить только контейнеры и volumes observability
    cmds:
      - "{{.INFRA_TOOL}} observability-clean"

  frontend:build:
    desc: Собрать все frontend-пакеты
    cmds:
      - pnpm build

  frontend:test:
    desc: Выполнить тесты всех frontend-пакетов
    cmds:
      - pnpm test

  frontend:lint:
    desc: Выполнить lint всех frontend-пакетов
    cmds:
      - pnpm lint

  frontend:typecheck:
    desc: Проверить типы всех frontend-пакетов
    cmds:
      - pnpm typecheck

  frontend:verify:
    desc: Выполнить все frontend-проверки
    cmds:
      - task: frontend:build
      - task: frontend:test
      - task: frontend:lint
      - task: frontend:typecheck
