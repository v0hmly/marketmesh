version: "3"

silent: true

env:
  GOWORK: "{{.ROOT_DIR}}/backend/go.work"

vars:
  WORKSPACE_TOOL: ./backend/tools/go-workspace.sh
  PROTOBUF_TOOL: ./api/tools/protobuf.sh
  INFRA_TOOL: ./infra/compose/scripts/local.sh
  ACCOUNT_LOCAL_TOOL: ./infra/account-local/local.sh
  E2E_TOPOLOGY_TOOL: go run ./backend/tools/e2e-topology
  TASKBOARD_TOOL: ./tools/taskboard.sh
  TASKBOARD_PROJECT: "01M1BNBBHNN26MRG0XAXVR5K5M"

tasks:
  generate:
    desc: Сгенерировать игнорируемые API-контракты и CSS дизайн-токенов
    cmds:
      - task: api:generate
      - task: design:generate

  design:generate:
    desc: Собрать CSS из исходных дизайн-токенов
    cmds:
      - node frontend/tools/generate-tokens-css.mjs

  default:
    desc: Показать доступные задачи
    cmds:
      - task --list

  hooks:install:
    desc: Подключить репозиторные Git hooks
    preconditions:
      - sh: test -x .githooks/pre-commit
        msg: Не найден исполняемый .githooks/pre-commit
    cmds:
      - |
        configured_path="$(git config --local --get core.hooksPath || true)"
        if [ -n "${configured_path}" ] && [ "${configured_path}" != ".githooks" ]; then
          printf 'core.hooksPath уже настроен: %s\n' "${configured_path}" >&2
          printf '%s\n' 'Удалите или перенесите существующие hooks перед установкой.' >&2
          exit 1
        fi
        git config --local core.hooksPath .githooks
        printf '%s\n' 'Git hooks подключены из .githooks.'

  layout:check:
    desc: Проверить размещение языковых файлов, пути Docker и локальные ссылки документации
    cmds:
      - python3 tools/layout-check.py

  fmt:
    desc: Отформатировать Go-код во всех модулях
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} fmt"

  fmt-check:
    desc: Проверить форматирование Go-кода
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} fmt-check"

  vet:
    desc: Выполнить go vet во всех модулях
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} vet"

  test:
    desc: Выполнить тесты во всех модулях
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} test"

  test-race:
    desc: Выполнить тесты с race detector во всех модулях
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} test-race"

  build:
    desc: Собрать все Go-пакеты во всех модулях
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} build"

  arch:
    desc: Проверить workspace и архитектурные зависимости
    deps: [api:generate]
    cmds:
      - "{{.WORKSPACE_TOOL}} arch"

  ci:bootstrap:
    desc: Установить закреплённые инструменты CI в bin
    cmds:
      - ./tools/ci.sh bootstrap

  ci:go:
    desc: Проверить Go workspace, модули с GOWORK=off и целостность зависимостей
    cmds:
      - ./tools/ci.sh go

  ci:frontend:
    desc: Установить frontend по lock-файлу и выполнить проверки
    cmds:
      - ./tools/ci.sh frontend

  ci:api:
    desc: Проверить protobuf относительно CI_BASE_REF (по умолчанию origin/dev)
    cmds:
      - ./tools/ci.sh api

  ci:security:
    desc: Проверить новые коммиты на секреты и зависимости на уязвимости
    cmds:
      - ./tools/ci.sh secrets
      - ./tools/ci.sh vulnerabilities

  ci:verify:
    desc: Выполнить набор CI локально (после ci:bootstrap)
    cmds:
      - ./tools/ci.sh workflow-lint
      - ./tools/ci-test.sh
      - task: ci:go
      - task: ci:frontend
      - task: ci:api
      - task: ci:security

  taskboard:list:
    desc: Показать задачи Taskboard (по умолчанию todo и in_progress; фильтры через -- --status done)
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          {{.TASKBOARD_TOOL}} ticket list --project {{.TASKBOARD_PROJECT}} {{.CLI_ARGS}}
        else
          {{.TASKBOARD_TOOL}} ticket list --project {{.TASKBOARD_PROJECT}} --status in_progress
          {{.TASKBOARD_TOOL}} ticket list --project {{.TASKBOARD_PROJECT}} --status todo
        fi

  taskboard:create:
    desc: Создать задачу Taskboard (task taskboard:create -- --title "..." --priority high)
    cmds:
      - "{{.TASKBOARD_TOOL}} ticket create --project {{.TASKBOARD_PROJECT}} {{.CLI_ARGS}}"

  taskboard:start:
    desc: Перевести задачу в in_progress (task taskboard:start -- <ticket-id>)
    cmds:
      - "{{.TASKBOARD_TOOL}} ticket move {{.CLI_ARGS}} --status in_progress"

  taskboard:done:
    desc: Перевести задачу в done (task taskboard:done -- <ticket-id>)
    cmds:
      - "{{.TASKBOARD_TOOL}} ticket move {{.CLI_ARGS}} --status done"

  taskboard:web:
    desc: Запустить web UI Taskboard с репозиторной базой
    cmds:
      - "{{.TASKBOARD_TOOL}} start {{.CLI_ARGS}}"

  taskboard:mcp:
    desc: Запустить Taskboard mcp с репозиторной базой
    cmds:
      - "{{.TASKBOARD_TOOL}} mcp {{.CLI_ARGS}}"

  api:bootstrap:
    desc: Установить зафиксированные protobuf-инструменты в корневой bin
    cmds:
      - "{{.PROTOBUF_TOOL}} bootstrap"

  api:versions:
    desc: Показать фактические версии protobuf-инструментов
    cmds:
      - "{{.PROTOBUF_TOOL}} versions"

  api:config:
    desc: Проверить api/easyp.yaml
    cmds:
      - "{{.PROTOBUF_TOOL}} config"

  api:deps:
    desc: Скачать protobuf-зависимости строго по api/easyp.lock
    cmds:
      - "{{.PROTOBUF_TOOL}} deps"

  api:deps:update:
    desc: Обновить protobuf-зависимости и api/easyp.lock
    cmds:
      - "{{.PROTOBUF_TOOL}} deps-update"

  api:lint:
    desc: Проверить protobuf-схемы с помощью EasyP
    cmds:
      - "{{.PROTOBUF_TOOL}} lint"

  api:generate:
    desc: Воспроизводимо сгенерировать Go и TypeScript контракты
    cmds:
      - "{{.PROTOBUF_TOOL}} generate"

  api:breaking:
    desc: Проверить protobuf-совместимость относительно dev
    cmds:
      - "{{.PROTOBUF_TOOL}} breaking"

  api:generate-check:
    desc: Проверить побайтовую воспроизводимость двух чистых генераций контрактов
    cmds:
      - "{{.PROTOBUF_TOOL}} generate-check"

  api:self-test:
    desc: Проверить генераторы, отрицательный lint и breaking change
    cmds:
      - "{{.PROTOBUF_TOOL}} self-test"

  api:verify:
    desc: Выполнить все проверки protobuf toolchain и контрактов
    cmds:
      - task: api:config
      - task: api:deps
      - task: api:lint
      - task: api:breaking
      - task: api:generate-check
      - task: api:self-test

  verify:
    desc: Выполнить обязательные локальные проверки workspace
    cmds:
      - task: api:verify
      - task: fmt-check
      - task: vet
      - task: test-race
      - task: build
      - task: arch

  dev:up:
    aliases: [up]
    desc: Поднять полный локальный стенд с Files, Mailpit, Grafana и Rybbit
    cmds:
      - python3 infra/dev/local.py up {{.CLI_ARGS}}

  dev:down:
    desc: Остановить полный локальный стенд с сохранением данных
    cmds:
      - python3 infra/dev/local.py down

  dev:reset:
    desc: Явно удалить данные только локального dev-стенда для новой установки
    cmds:
      - python3 infra/dev/local.py reset

  dev:stop:
    desc: Остановить выбранные приложения, сохранив общие базы и очереди
    cmds:
      - python3 infra/dev/local.py stop {{.CLI_ARGS}}

  dev:status:
    desc: Показать состояние полного локального стенда
    cmds:
      - python3 infra/dev/local.py status

  dev:renew:
    desc: Обновить локальные сертификаты и перезапустить стенд без удаления данных
    cmds:
      - python3 infra/dev/local.py renew {{.CLI_ARGS}}

  dev:config:
    desc: Подготовить локальные ключи и проверить единый Compose
    cmds:
      - python3 infra/dev/local.py config

  dev:logs:
    desc: Показать последние логи выбранных сервисов
    cmds:
      - python3 infra/dev/local.py logs {{.CLI_ARGS}}

  infra:env:
    desc: Создать локальную конфигурацию инфраструктуры без вывода секретов
    cmds:
      - "{{.INFRA_TOOL}} env"

  infra:config:
    desc: Проверить итоговую Docker Compose конфигурацию
    cmds:
      - "{{.INFRA_TOOL}} config"

  infra:up:
    desc: Запустить локальную инфраструктуру и дождаться готовности
    cmds:
      - python3 infra/dev/local.py up --profile infrastructure

  infra:ready:
    desc: Проверить готовность локальной инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} ready"

  infra:smoke:
    desc: Проверить PostgreSQL и сетевую изоляцию DMZ
    cmds:
      - "{{.INFRA_TOOL}} smoke"

  infra:persistence:
    desc: Проверить сохранность данных после обычного restart
    cmds:
      - "{{.INFRA_TOOL}} persistence"

  infra:verify:
    desc: Запустить окружение и выполнить все инфраструктурные проверки
    cmds:
      - "{{.INFRA_TOOL}} verify"

  infra:status:
    desc: Показать состояние контейнеров инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} status"

  infra:logs:
    desc: Следить за логами локальной инфраструктуры
    cmds:
      - "{{.INFRA_TOOL}} logs"

  infra:psql-rw:
    desc: Открыть psql через RW endpoint primary
    cmds:
      - "{{.INFRA_TOOL}} psql-rw"

  infra:psql-ro:
    desc: Открыть psql через RO endpoint synchronous replica
    cmds:
      - "{{.INFRA_TOOL}} psql-ro"

  postgres:integration:
    desc: Выполнить интеграционные тесты PostgreSQL против primary и synchronous replica
    cmds:
      - bash backend/platform/postgres/testdata/integration.sh

  redis:integration:
    desc: Выполнить интеграционные тесты независимых edge и auth Redis
    cmds:
      - bash backend/platform/redis/testdata/integration.sh

  auth:integration:
    desc: Выполнить интеграционные тесты PostgreSQL-адаптера Auth
    cmds:
      - bash backend/services/auth/internal/adapter/out/postgres/testdata/integration.sh

  auth:sessions:integration:
    desc: Проверить ротацию и отзыв сессий Auth с PostgreSQL и Redis
    cmds:
      - bash backend/services/auth/internal/adapter/out/postgressession/testdata/integration.sh

  user:integration:
    desc: Проверить профиль User с PostgreSQL primary/replica, mTLS и проверкой сессии
    cmds:
      - bash backend/services/user/internal/adapter/out/postgres/testdata/integration.sh

  auth:browser:integration:
    desc: Проверить публичный HTTPS Auth через обратный mTLS-туннель с PostgreSQL и Redis
    cmds:
      - bash backend/services/gateway-in/internal/app/testdata/auth/integration.sh

  auth:registration:integration:
    desc: Проверить атомарную регистрацию и доставку outbox через PostgreSQL и NATS JetStream
    cmds:
      - bash backend/services/auth/internal/app/testdata/registration/integration.sh

  user:registration:integration:
    desc: Проверить регистрацию Auth, inbox User и backfill через настоящий JetStream
    cmds:
      - bash backend/services/user/internal/app/testdata/registration/integration.sh

  tunnel-e2e:images:
    desc: Собрать локальные immutable-source образы MM-29 без публикации
    cmds:
      - bash backend/e2e/tunnel/scripts/images.sh

  tunnel-e2e:load:
    desc: Импортировать образы MM-29 в containerd всех четырёх VM topology MM-44
    vars:
      TUNNEL_IMAGE_VERSION:
        sh: git rev-parse --short=12 HEAD
    cmds:
      - >-
        {{.E2E_TOPOLOGY_TOOL}} load-images
        --image marketmesh/gateway-in:mm29-{{.TUNNEL_IMAGE_VERSION}}
        --image marketmesh/gateway-out:mm29-{{.TUNNEL_IMAGE_VERSION}}
        --image marketmesh/fake-internal:mm29-{{.TUNNEL_IMAGE_VERSION}}

  tunnel-e2e:deploy:
    desc: Развернуть workloads MM-29 в четырёх явных kubeconfig
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/workloadctl deploy {{.CLI_ARGS}}

  tunnel-e2e:inspect:
    desc: Собрать bounded diagnostics workloads MM-29
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/workloadctl inspect {{.CLI_ARGS}}

  tunnel-e2e:frontdoor:
    desc: Запустить локальный health-aware front door MM-30 для двух DC
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/frontdoor {{.CLI_ARGS}}

  tunnel-e2e:rolling:
    desc: Выполнить bounded rolling redeploy или rollback-матрицу MM-34
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/rollingctl {{.CLI_ARGS}}

  tunnel-e2e:undeploy:
    desc: Собрать diagnostics и удалить точные workloads MM-29
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/workloadctl undeploy {{.CLI_ARGS}}

  tunnel-e2e:pod-chaos:
    desc: Выполнить последовательный pod kill/redeploy MM-32 под continuous load
    deps: [api:generate]
    cmds:
      - go run ./backend/e2e/tunnel/cmd/podchaos {{.CLI_ARGS}}

  infra:down:
    desc: Остановить окружение с сохранением данных
    cmds:
      - "{{.INFRA_TOOL}} down"

  infra:clean:
    desc: Остановить окружение и полностью удалить его volumes
    cmds:
      - "{{.INFRA_TOOL}} clean"

  e2e:topology:bootstrap:
    desc: Установить проверенные k3s и kubectl, проверить orbctl и собрать TCP-probe MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} bootstrap"

  e2e:topology:versions:
    desc: Показать зафиксированные версии topology toolchain
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} versions"

  e2e:topology:inventory:
    desc: Показать versioned inventory четырёх кластеров MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} inventory"

  e2e:topology:targets:
    desc: Разрешить или повторно проверить immutable fault targets MM-38
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} targets {{.CLI_ARGS}}"

  e2e:topology:up:
    desc: Создать четыре disposable OrbStack VM с k3s MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} up"

  e2e:topology:ready:
    desc: Проверить готовность и зональную изоляцию topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} ready"

  e2e:topology:inspect:
    desc: Собрать безопасные diagnostics topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} inspect"

  e2e:topology:down:
    desc: Собрать diagnostics и удалить только ресурсы topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} down"

  e2e:topology:verify:
    desc: Дважды проверить полный lifecycle и изоляцию topology MM-44
    cmds:
      - "{{.E2E_TOPOLOGY_TOOL}} verify"

  observability:config:
    desc: Проверить конфигурации Alloy, Tempo, Loki, HAProxy и Docker Compose
    cmds:
      - "{{.INFRA_TOOL}} observability-config"

  observability:up:
    desc: Запустить локальный observability-стек
    cmds:
      - python3 infra/dev/local.py up observability-gateway

  observability:ready:
    desc: Проверить health checks локального observability-стека
    cmds:
      - "{{.INFRA_TOOL}} observability-ready"

  observability:smoke:
    desc: Проверить связанные trace и log через Alloy, Tempo, Loki и Grafana
    cmds:
      - "{{.INFRA_TOOL}} observability-smoke"

  observability:outage:
    desc: Проверить bounded queues Alloy при недоступных Tempo и Loki
    cmds:
      - "{{.INFRA_TOOL}} observability-outage"

  observability:persistence:
    desc: Проверить сохранность traces и logs после restart
    cmds:
      - "{{.INFRA_TOOL}} observability-persistence"

  observability:verify:
    desc: Запустить observability-стек и выполнить все его проверки
    cmds:
      - "{{.INFRA_TOOL}} observability-verify"

  observability:status:
    desc: Показать состояние контейнеров observability
    cmds:
      - "{{.INFRA_TOOL}} observability-status"

  observability:logs:
    desc: Следить за логами observability-стека
    cmds:
      - "{{.INFRA_TOOL}} observability-logs"

  observability:down:
    desc: Остановить observability-стек с сохранением данных
    cmds:
      - "{{.INFRA_TOOL}} observability-down"

  observability:clean:
    desc: Удалить только контейнеры и volumes observability
    cmds:
      - "{{.INFRA_TOOL}} observability-clean"

  analytics:config:
    desc: Проверить Compose Rybbit
    cmds:
      - ./infra/rybbit/local.sh config

  analytics:up:
    desc: Поднять локальный Rybbit и подготовить сайт storefront
    cmds:
      - python3 infra/dev/local.py up analytics-gateway

  analytics:status:
    desc: Показать состояние Rybbit
    cmds:
      - ./infra/rybbit/local.sh status

  analytics:logs:
    desc: Показать логи Rybbit
    cmds:
      - ./infra/rybbit/local.sh logs

  analytics:down:
    desc: Остановить Rybbit с сохранением данных
    cmds:
      - ./infra/rybbit/local.sh down

  analytics:clean:
    desc: Удалить локальный Rybbit и его данные
    cmds:
      - ./infra/rybbit/local.sh clean

  analytics:verify:
    desc: Проверить ingestion, dashboard и persistence в одноразовом Rybbit
    cmds:
      - ./infra/rybbit/local.sh verify


  account:up:
    desc: Запустить локальный HTTPS storefront с настоящими Auth/User и событиями регистрации
    cmds:
      - python3 infra/dev/local.py up frontdoor

  account:status:
    desc: Показать состояние локального контура аккаунта
    cmds:
      - "{{.ACCOUNT_LOCAL_TOOL}} status"

  account:probe:
    desc: Проверить агрегированные счётчики outbox, inbox и доставки профилей без персональных данных
    cmds:
      - "{{.ACCOUNT_LOCAL_TOOL}} probe"

  account:down:
    desc: Остановить локальный контур аккаунта с сохранением данных
    cmds:
      - "{{.ACCOUNT_LOCAL_TOOL}} down"

  account:reset:
    desc: Удалить данные и сертификаты только выбранного локального контура аккаунта
    cmds:
      - "{{.ACCOUNT_LOCAL_TOOL}} reset"

  account:test:
    desc: Проверить настоящий browser→Auth→JetStream→User сценарий в изолированном контуре
    cmds:
      - "{{.ACCOUNT_LOCAL_TOOL}} test"

  frontend:build:
    desc: Собрать все frontend-пакеты
    cmds:
      - cd frontend && pnpm build

  frontend:test:
    desc: Выполнить тесты всех frontend-пакетов
    cmds:
      - cd frontend && pnpm test

  frontend:lint:
    desc: Выполнить lint всех frontend-пакетов
    cmds:
      - cd frontend && pnpm lint

  frontend:typecheck:
    desc: Проверить типы всех frontend-пакетов
    cmds:
      - cd frontend && pnpm typecheck

  frontend:verify:
    desc: Выполнить все frontend-проверки
    cmds:
      - task: frontend:build
      - task: frontend:test
      - task: frontend:lint
      - task: frontend:typecheck

  mail:config:
    desc: Проверить Compose Mailpit
    cmds:
      - ./infra/mailpit/local.sh config

  mail:up:
    desc: Поднять локальный SMTP и web UI Mailpit
    cmds:
      - ./infra/mailpit/local.sh up

  mail:status:
    desc: Показать состояние Mailpit
    cmds:
      - ./infra/mailpit/local.sh status

  mail:logs:
    desc: Показать логи Mailpit
    cmds:
      - ./infra/mailpit/local.sh logs

  mail:down:
    desc: Остановить Mailpit с сохранением писем
    cmds:
      - ./infra/mailpit/local.sh down

  mail:clean:
    desc: Удалить локальный Mailpit и все сохранённые письма
    cmds:
      - ./infra/mailpit/local.sh clean

  mail:verify:
    desc: Проверить SMTP, UI и persistence в одноразовом Mailpit
    cmds:
      - ./infra/mailpit/local.sh verify
