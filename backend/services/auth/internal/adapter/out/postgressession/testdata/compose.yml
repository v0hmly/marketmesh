services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username auth_test --dbname auth"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [auth-session-integration]
  redis:
    image: redis:8.10.1-alpine3.23
    command: ["redis-server", "--requirepass", "auth_session_test_password", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "auth_session_test_password", "PING"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [auth-session-integration]
  auth-session-integration:
    build:
      context: ../../../../../../../..
      dockerfile: backend/services/auth/internal/adapter/out/postgressession/testdata/Dockerfile
    environment:
      MARKETMESH_AUTH_POSTGRES_DSN: postgres://auth_test:auth_test_password@postgres:5432/auth?sslmode=disable
      MARKETMESH_AUTH_REDIS_ADDRESS: redis:6379
      MARKETMESH_AUTH_REDIS_PASSWORD: auth_session_test_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [auth-session-integration]
networks:
  auth-session-integration:
    internal: true
