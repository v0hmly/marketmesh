services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_password
    command:
      - bash
      - -ec
      - |
        printf 'local all all trust\nhost all all all scram-sha-256\nhost replication auth_test all scram-sha-256\n' > /tmp/registration-pg-hba.conf
        exec docker-entrypoint.sh postgres -c hba_file=/tmp/registration-pg-hba.conf -c wal_level=replica -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username auth_test --dbname auth"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [auth-browser-integration]

  postgres-ro:
    image: postgres:18.6-bookworm
    environment:
      PGPASSWORD: auth_test_password
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/18/replica
        gosu postgres pg_basebackup -h postgres -U auth_test -D /var/lib/postgresql/18/replica -R -X stream
        exec gosu postgres postgres -D /var/lib/postgresql/18/replica
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U auth_test -d auth -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [auth-browser-integration]

  redis:
    image: redis:8.10.1-alpine3.23
    command: ["redis-server", "--requirepass", "auth_browser_fixture", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "auth_browser_fixture", "PING"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [auth-browser-integration]
  auth-browser-integration:
    image: ${AUTH_BROWSER_TEST_IMAGE:?set by integration.sh}
    build:
      context: ../../../../../../..
      dockerfile: backend/services/gateway-in/internal/app/testdata/auth/Dockerfile
    environment:
      MARKETMESH_AUTH_POSTGRES_DSN: postgres://auth_test:auth_test_password@postgres:5432/auth?sslmode=disable
      MARKETMESH_AUTH_POSTGRES_RO_DSN: postgres://auth_test:auth_test_password@postgres-ro:5432/auth?sslmode=disable
      MARKETMESH_AUTH_REDIS_ADDRESS: redis:6379
      MARKETMESH_AUTH_REDIS_PASSWORD: auth_browser_fixture
    networks: [auth-browser-integration]
networks:
  auth-browser-integration:
    internal: true
