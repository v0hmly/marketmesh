<!doctype html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>MarketMesh</title>
<style>
  a:hover { color: #111110 !important; }
  @media (prefers-color-scheme: dark) {
    .em-page { background-color: #161615 !important; }
    .em-card { background-color: #1f1f1d !important; border-color: #45443f !important; }
    .em-ink { color: #ecebe7 !important; }
    .em-muted { color: #b9b6ae !important; }
    .em-tint { background-color: #2a2822 !important; }
    .em-link { color: #f2c46a !important; }
    .em-btn { background-color: #ecebe7 !important; }
    .em-btn-label { color: #1a1a19 !important; }
    .em-mark { background-color: #ecebe7 !important; color: #1a1a19 !important; }
    .em-error { background-color: #3b2522 !important; border-color: #9e6c63 !important; }
    .em-on-error { color: #f6c1b8 !important; }
    .em-hr { border-color: #45443f !important; }
    a:hover { color: #ffffff !important; }
  }
</style>
</head>
<body class="em-page" style="margin: 0; padding: 0; background-color: #f6f4ef;">
<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">{{ .Preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="em-page" style="background-color: #f6f4ef;">
  <tr>
    <td align="center" style="padding: 48px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="em-card" style="width: 600px; max-width: 100%; background-color: #fffffd; border: 1px solid #e3e0d8; border-radius: 18px;">
        <tr>
          <td style="padding: 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="36" height="36" align="center" valign="middle" class="em-mark" style="width: 36px; height: 36px; border-radius: 50%; background-color: #2b2b2a; color: #fffdf6; font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 36px;">m</td>
                <td style="padding-left: 12px; font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; color: #232322;" class="em-ink">MarketMesh<span style="color: #d89a1a;">.</span></td>
              </tr>
            </table>
            <div style="height: 24px; line-height: 24px; font-size: 0;">&nbsp;</div>
            {{ template "content" . }}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
