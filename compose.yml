# Единый dev-проект: приложения используют общие PostgreSQL, Redis, ClickHouse и NATS.
name: marketmesh-dev

x-app-build: &app-build
  context: .
  dockerfile: infra/account-local/Dockerfile
  args:
    VITE_ACCOUNT_AVATAR_ENABLED: "true"
    VITE_FILES_UPLOAD_ORIGIN: https://localhost:18343
    VITE_FILES_DOWNLOAD_ORIGINS: https://localhost:18344,https://localhost:18345
    VITE_RYBBIT_ENABLED: ${ACCOUNT_RYBBIT_ENABLED:-false}

services:
  mailpit:
    extends: {file: infra/account-local/compose.yml, service: mailpit}
  postgres-primary:
    image: postgres:18.6-bookworm
    entrypoint: [bash, /scripts/primary.sh]
    env_file: ${MM_SHARED_STATE}/postgres.env
    networks:
      internal: {aliases: [pg-primary]}
      files-internal: {aliases: [pg-primary]}
      storage: {aliases: [pg-primary]}
    volumes:
      - postgres-primary:/var/lib/postgresql
      - ./infra/dev/postgres/primary.sh:/scripts/primary.sh:ro
      - ./infra/dev/postgres/init.sh:/docker-entrypoint-initdb.d/10-shared.sh:ro
      - ./backend/services/files/migrations:/migrations/files:ro
      - ${MM_SHARED_STATE}/postgres-init.sql:/run/shared-init.sql:ro
      - ${MM_FILES_STATE}/pki/pg-primary.crt:/pki/server.crt:ro
      - ${MM_FILES_STATE}/pki/pg-primary.key:/pki/server.key:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -q -h 127.0.0.1 -U fixture_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
  postgres-replica:
    image: postgres:18.6-bookworm
    entrypoint: [bash, /scripts/replica.sh]
    environment: {PGDATA: /var/lib/postgresql/18/replica}
    networks:
      internal: {aliases: [pg-replica]}
      files-internal: {aliases: [pg-replica]}
      storage: {aliases: [pg-replica]}
    volumes:
      - postgres-replica:/var/lib/postgresql
      - ./infra/dev/postgres/replica.sh:/scripts/replica.sh:ro
      - ${MM_SHARED_STATE}/replication.pgpass:/run/replication.pgpass:ro
      - ${MM_FILES_STATE}/pki/ca.crt:/pki/ca.crt:ro
      - ${MM_FILES_STATE}/pki/pg-replica.crt:/pki/server.crt:ro
      - ${MM_FILES_STATE}/pki/pg-replica.key:/pki/server.key:ro
    depends_on: {postgres-primary: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "gosu postgres psql -U fixture_admin -d postgres -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 2s
      timeout: 2s
      retries: 60
  redis:
    image: redis:8.10.1-alpine3.23
    user: "0:0"
    command: [redis-server, /secrets/redis.conf]
    env_file: ${MM_SHARED_STATE}/redis-health.env
    volumes:
      - ${MM_SHARED_STATE}/redis.conf:/secrets/redis.conf:ro
      - redis-data:/data
    mem_limit: 512m
    networks: [internal, storage]
    healthcheck:
      test: [CMD, redis-cli, --user, health, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  nats:
    extends: {file: infra/account-local/compose.yml, service: nats}
    volumes:
      - ./infra/dev/nats.conf:/secrets/nats.conf:ro
  provision:
    extends: {file: infra/account-local/compose.yml, service: provision}
    profiles: !reset []
    build: *app-build
    depends_on:
      postgres-primary: {condition: service_healthy}
      postgres-replica: {condition: service_healthy}
      nats: {condition: service_started}
  auth:
    extends: {file: infra/account-local/compose.yml, service: auth}
    build: *app-build
    volumes: ["${ACCOUNT_LOCAL_STATE}/files-pki:/workload:ro"]
    depends_on:
      provision: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}
  user:
    extends: {file: infra/account-local/compose.yml, service: user}
    build: *app-build
    volumes: ["${ACCOUNT_LOCAL_STATE}/files-pki:/workload:ro"]
    depends_on:
      provision: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
  gateway-in:
    extends: {file: infra/account-local/compose.yml, service: gateway-in}
    build: *app-build
    scale: 2
  gateway-out:
    extends: {file: infra/account-local/compose.yml, service: gateway-out}
    build: *app-build
    volumes: ["${ACCOUNT_LOCAL_STATE}/files-pki:/workload:ro"]
    depends_on:
      auth: {condition: service_healthy}
      user: {condition: service_healthy}
      gateway-in: {condition: service_started}
      files-control: {condition: service_started}
  frontdoor:
    extends: {file: infra/account-local/compose.yml, service: frontdoor}
    build: *app-build
    environment:
      ACCOUNT_FILES_ORIGINS: https://localhost:18343,https://localhost:18344,https://localhost:18345
      ACCOUNT_RYBBIT_ENABLED: ${ACCOUNT_RYBBIT_ENABLED:-false}
      RYBBIT_SITE_ID: ${RYBBIT_SITE_ID:-1}
    networks: [dmz, ingress, analytics]
    depends_on:
      gateway-out: {condition: service_healthy}
  volume-init:
    extends: {file: infra/files-local/compose.yml, service: volume-init}
  bao:
    extends: {file: infra/files-local/compose.yml, service: bao}
  quarantine:
    extends: {file: infra/files-local/compose.yml, service: quarantine}
  internal-clean:
    extends: {file: infra/files-local/compose.yml, service: internal-clean}
  delivery-a:
    extends: {file: infra/files-local/compose.yml, service: delivery-a}
  delivery-b:
    extends: {file: infra/files-local/compose.yml, service: delivery-b}


  sandbox:
    extends: {file: infra/files-local/compose.yml, service: sandbox}
  antivirus:
    extends: {file: infra/files-local/compose.yml, service: antivirus}
    depends_on:
      signatures: {condition: service_completed_successfully}
  signatures:
    extends: {file: infra/files-local/compose.yml, service: signatures}
    profiles: !reset []
    build: {context: ., dockerfile: infra/files-local/Dockerfile, target: antivirus}
  worker:
    extends: {file: infra/files-local/compose.yml, service: worker}
    depends_on: !override
      postgres-primary: {condition: service_healthy}
      postgres-replica: {condition: service_healthy}
      quarantine: {condition: service_started}
      internal-clean: {condition: service_started}
      delivery-a: {condition: service_started}
      delivery-b: {condition: service_started}
      sandbox: {condition: service_started}
      antivirus: {condition: service_started}
  files-control:
    image: marketmesh-mm43-files:local
    build: {context: ., dockerfile: infra/files-local/Dockerfile, target: runtime}
    user: "${MM_FILES_UID}:${MM_FILES_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: {FILES_CONFIG_FILE: /config.json}
    volumes:
      - ${ACCOUNT_LOCAL_STATE}/files-control.json:/config.json:ro
      - ${ACCOUNT_LOCAL_STATE}/files-pki:/workload:ro
      - ${MM_FILES_STATE}/pki/ca.crt:/pki/ca.crt:ro
    networks: [internal, files-internal, quarantine-dmz, delivery-a-dmz, delivery-b-dmz]
    depends_on:
      auth: {condition: service_healthy}
      worker: {condition: service_started}
    logging: {driver: json-file, options: {max-size: 1m, max-file: "1"}}


  browser:
    extends: {file: infra/account-local/compose.yml, service: browser}
    profiles: [test]
    networks: !reset []
    network_mode: host
    environment:
      BASE_URL: https://localhost:18443
      MAILPIT_URL: http://localhost:18025
      ACCOUNT_AVATAR_E2E: "true"
      ACCOUNT_E2E_SHARED: "true"
      ACCOUNT_E2E_ANALYTICS: ${ACCOUNT_RYBBIT_ENABLED:-false}
      PUBLIC_FILES_CA: /certs/files-ca.pem
      PUBLIC_COMBINED_CA: /certs/combined-ca.pem

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    profiles: [infrastructure, analytics, full]
    env_file: ${MM_SHARED_STATE}/clickhouse.env
    mem_limit: 2g
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/dev/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./infra/dev/clickhouse/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ${MM_SHARED_STATE}/clickhouse-users.xml:/etc/clickhouse-server/users.d/shared.xml:ro
      - ./infra/dev/clickhouse/init.sql:/docker-entrypoint-initdb.d/10-shared.sql:ro
    networks: [storage]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8123/ping]
      interval: 3s
      timeout: 5s
      retries: 60
  analytics-backend:
    extends: {file: infra/rybbit/compose.yml, service: backend}
    image: marketmesh-dev-rybbit:local
    build: {context: ., dockerfile: infra/dev/Dockerfile.rybbit}
    env_file: ${MM_SHARED_STATE}/rybbit.env
    environment:
      POSTGRES_HOST: pg-primary
      REDIS_HOST: redis
      CLICKHOUSE_HOST: http://clickhouse:8123
    volumes:
      - ${MM_FILES_STATE}/pki/ca.crt:/pki/ca.crt:ro
    profiles: [analytics, full]
    networks: !override
      storage: {aliases: [backend]}
      analytics: {aliases: [backend]}
    depends_on: !override
      postgres-primary: {condition: service_healthy}
      postgres-replica: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  analytics-client:
    extends: {file: infra/rybbit/compose.yml, service: client}
    profiles: [analytics, full]
    networks: !override
      analytics: {aliases: [client]}
    depends_on: !override
      analytics-backend: {condition: service_healthy}
  analytics-gateway:
    extends: {file: infra/rybbit/compose.yml, service: gateway}
    profiles: [analytics, full]
    networks: !override
      analytics: {aliases: [gateway]}
    depends_on: !override
      analytics-backend: {condition: service_healthy}
      analytics-client: {condition: service_healthy}
  observability-init:
    extends: {file: infra/compose/compose.yml, service: observability-init}
    profiles: [observability, full]
  alloy-dmz:
    extends: {file: infra/compose/compose.yml, service: alloy-dmz}
    profiles: [observability, full]
  alloy-internal:
    extends: {file: infra/compose/compose.yml, service: alloy-internal}
    profiles: [observability, full]
  tempo:
    extends: {file: infra/compose/compose.yml, service: tempo}
    profiles: [observability, full]
  loki:
    extends: {file: infra/compose/compose.yml, service: loki}
    profiles: [observability, full]
  grafana:
    extends: {file: infra/compose/compose.yml, service: grafana}
    profiles: [observability, full]
  observability-gateway:
    extends: {file: infra/compose/compose.yml, service: observability-gateway}
    profiles: [observability, full]

networks:
  internal:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  dmz:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  mail:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  ingress:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  files-internal:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  quarantine-dmz:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  delivery-a-dmz:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  delivery-b-dmz:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  kms-q:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  kms-internal:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  kms-a:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  kms-b:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  bootstrap:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  storage:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  analytics:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  observability:
    internal: true
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  observability-access:
    internal: false
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}

volumes:
  mailpit:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  postgres-primary:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  postgres-replica:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  nats-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  bao:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  quarantine:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  internal-clean:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  delivery-a:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  delivery-b:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  av-socket:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  sandbox-socket:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  signatures:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  tempo-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  loki-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  grafana-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  redis-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
  clickhouse-data:
    labels: {marketmesh.dev.workspace: "${MM_DEV_ROOT}"}
