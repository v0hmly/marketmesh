syntax = "proto3";

package gateway.v1;

import "auth/v1/auth.proto";
import "user/v1/user.proto";

option go_package = "github.com/v0hmly/marketmesh/api/gen/go/gateway/v1;gatewayv1";

// UserBrowserService defines private tunnel envelopes, not an exposed network service.
// Gateway-out exchanges the browser cookie with Auth, then calls User with an assertion.
service UserBrowserService {
  // GetMe resolves the browser session and reads its owner's profile.
  rpc BrowserGetMe(BrowserGetMeRequest) returns (BrowserGetMeResponse);
  // UpdateMe resolves the browser session and conditionally updates its owner's profile.
  rpc BrowserUpdateMe(BrowserUpdateMeRequest) returns (BrowserUpdateMeResponse);
  // BrowserListAddresses exchanges the browser session before the owner-scoped operation.
  rpc BrowserListAddresses(BrowserListAddressesRequest) returns (BrowserListAddressesResponse);
  // BrowserCreateAddress exchanges the browser session before the owner-scoped operation.
  rpc BrowserCreateAddress(BrowserCreateAddressRequest) returns (BrowserCreateAddressResponse);
  // BrowserUpdateAddress exchanges the browser session before the owner-scoped operation.
  rpc BrowserUpdateAddress(BrowserUpdateAddressRequest) returns (BrowserUpdateAddressResponse);
  // BrowserDeleteAddress exchanges the browser session before the owner-scoped operation.
  rpc BrowserDeleteAddress(BrowserDeleteAddressRequest) returns (BrowserDeleteAddressResponse);
  // BrowserSetDefaultAddress exchanges the browser session before the owner-scoped operation.
  rpc BrowserSetDefaultAddress(BrowserSetDefaultAddressRequest) returns (BrowserSetDefaultAddressResponse);
  // BrowserGetSettings resolves the current owner before reading preferences.
  rpc BrowserGetSettings(BrowserGetSettingsRequest) returns (BrowserGetSettingsResponse);
  // BrowserUpdateSettings resolves the current owner before conditionally changing preferences.
  rpc BrowserUpdateSettings(BrowserUpdateSettingsRequest) returns (BrowserUpdateSettingsResponse);
  // BrowserGetAvatar resolves the current browser owner before the bounded avatar operation.
  rpc BrowserGetAvatar(BrowserGetAvatarRequest) returns (BrowserGetAvatarResponse);
  // BrowserSetAvatar resolves the current browser owner before the bounded avatar operation.
  rpc BrowserSetAvatar(BrowserSetAvatarRequest) returns (BrowserSetAvatarResponse);
  // BrowserClearAvatar resolves the current browser owner before the bounded avatar operation.
  rpc BrowserClearAvatar(BrowserClearAvatarRequest) returns (BrowserClearAvatarResponse);
}

// BrowserGetMeRequest is reconstructed only from typed public input and allowed HTTP headers.
message BrowserGetMeRequest {
  // Request contains no caller-selected identity or credentials.
  user.v1.GetMeRequest request = 1;
  // Context contains opaque credentials that must never reach User or telemetry.
  auth.v1.BrowserContext context = 2;
}

// BrowserUpdateMeRequest keeps browser context separate from the public domain DTO.
message BrowserUpdateMeRequest {
  // Request contains only editable fields and the expected concurrency version.
  user.v1.UpdateMeRequest request = 1;
  // Context contains opaque credentials that must never reach User or telemetry.
  auth.v1.BrowserContext context = 2;
}

// BrowserGetMeResponse contains either the successful result or one finite failure.
message BrowserGetMeResponse {
  // Response is present only for a successful User call.
  user.v1.GetMeResponse response = 1;
  // Failure preserves only explicitly allowed domain outcomes, never upstream messages.
  UserBrowserFailure failure = 2;
}

// BrowserUpdateMeResponse contains either the committed result or one finite failure.
message BrowserUpdateMeResponse {
  // Response is present only for a successful User call.
  user.v1.UpdateMeResponse response = 1;
  // Failure preserves only explicitly allowed domain outcomes, never upstream messages.
  UserBrowserFailure failure = 2;
}

// UserBrowserFailure is the closed allowlist of domain outcomes preserved across the tunnel.
enum UserBrowserFailure {
  // USER_BROWSER_FAILURE_UNSPECIFIED means no domain failure; a response is required.
  USER_BROWSER_FAILURE_UNSPECIFIED = 0;
  // USER_BROWSER_FAILURE_PROFILE_NOT_READY means an authenticated profile is still being prepared.
  USER_BROWSER_FAILURE_PROFILE_NOT_READY = 1;
  // USER_BROWSER_FAILURE_VERSION_CONFLICT requires the caller to read and reconcile current data.
  USER_BROWSER_FAILURE_VERSION_CONFLICT = 2;
  // USER_BROWSER_FAILURE_ADDRESS_NOT_FOUND hides both foreign and absent address identifiers.
  USER_BROWSER_FAILURE_ADDRESS_NOT_FOUND = 3;
  // USER_BROWSER_FAILURE_ADDRESS_LIMIT_REACHED means the owner already has 20 saved addresses.
  USER_BROWSER_FAILURE_ADDRESS_LIMIT_REACHED = 4;
  // USER_BROWSER_FAILURE_AVATAR_UNAVAILABLE hides missing, foreign, retired or unready files.
  USER_BROWSER_FAILURE_AVATAR_UNAVAILABLE = 5;
}

// BrowserListAddressesRequest contains typed public input and separately reconstructed credentials.
message BrowserListAddressesRequest {
  // Request contains no caller-selected identity or credentials.
  user.v1.ListAddressesRequest request = 1;
  // Context contains opaque credentials that never reach User or telemetry.
  auth.v1.BrowserContext context = 2;
}

// BrowserListAddressesResponse contains one successful snapshot or an allowed failure.
message BrowserListAddressesResponse {
  // Response is present only after a successful operation.
  user.v1.ListAddressesResponse response = 1;
  // Failure preserves only explicitly allowed outcomes, never upstream messages.
  UserBrowserFailure failure = 2;
}

