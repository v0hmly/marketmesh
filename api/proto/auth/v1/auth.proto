syntax = "proto3";

package auth.v1;

option go_package = "github.com/v0hmly/marketmesh/api/gen/go/auth/v1;authv1";

// AuthService registers and verifies user-controlled credentials.
service AuthService {
  // RegisterCredentials accepts a credential without disclosing whether its identifier already exists.
  rpc RegisterCredentials(RegisterCredentialsRequest) returns (RegisterCredentialsResponse);
  // Login verifies a credential and returns an opaque subject identifier on success.
  rpc Login(LoginRequest) returns (LoginResponse);
  // RefreshSession rotates the HttpOnly refresh cookie; consumed-token reuse revokes its family.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  // Logout revokes the session authenticated by its HttpOnly access cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // LogoutAll revokes every session of the authenticated subject.
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
  // StartLoginCodeChange manages the authenticated caller's account security.
  rpc StartLoginCodeChange(StartLoginCodeChangeRequest) returns (StartLoginCodeChangeResponse);
  // CompleteLoginCodeChange manages the authenticated caller's account security.
  rpc CompleteLoginCodeChange(CompleteLoginCodeChangeRequest) returns (CompleteLoginCodeChangeResponse);
  // ChangePassword manages the authenticated caller's account security.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // StartLogin verifies the password and either creates a session or emails a required login code.
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  // CompleteLogin verifies the emailed code and establishes the session.
  rpc CompleteLogin(CompleteLoginRequest) returns (CompleteLoginResponse);
  // ResendLoginCode replaces the code of a pending challenge without asking the password again.
  rpc ResendLoginCode(ResendLoginCodeRequest) returns (ResendLoginCodeResponse);
  // RequestEmailVerification emails a confirmation link without disclosing account existence.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  // ConfirmEmail applies the emailed confirmation token.
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);
  // RequestPasswordReset emails a reset link without disclosing account existence.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // ConfirmPasswordReset sets a new password and revokes every existing session.
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);
  // GetCredentials returns the authenticated caller's contact and security state.
  rpc GetCredentials(GetCredentialsRequest) returns (GetCredentialsResponse);
  // StartEmailChange begins the two-letter email change for the authenticated caller.
  rpc StartEmailChange(StartEmailChangeRequest) returns (StartEmailChangeResponse);
  // ConfirmEmailChange applies the token sent to the new address.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
  // CancelEmailChange cancels a pending change via the token sent to the old address.
  rpc CancelEmailChange(CancelEmailChangeRequest) returns (CancelEmailChangeResponse);
  // ListSessions returns the authenticated caller's own sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession ends one of the authenticated caller's sessions.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // RequestAccountDeletion schedules deletion after a grace period and closes the sessions.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (RequestAccountDeletionResponse);
  // CancelAccountDeletion restores the account via the token sent by email.
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse);
}

// RegisterCredentialsRequest carries the secret material needed for credential registration.
message RegisterCredentialsRequest {
  // Identifier is the case-insensitive credential name and must not be logged or traced.
  string identifier = 1;
  // Password is the raw secret and must not be persisted, logged, or traced.
  bytes password = 2;
}

// RegisterCredentialsResponse deliberately contains no existence signal.
message RegisterCredentialsResponse {}

// LoginRequest carries the secret material needed for credential verification.
message LoginRequest {
  // Identifier is the case-insensitive credential name and must not be logged or traced.
  string identifier = 1;
  // Password is the raw secret and must not be persisted, logged, or traced.
  bytes password = 2;
}

// LoginResponse contains the opaque identity established by successful verification.
message LoginResponse {
  // SubjectId is an opaque 16-byte identifier and is never an authentication secret.
  bytes subject_id = 1;
}

// RefreshSessionRequest uses only the secure refresh cookie, never a token in the body.
message RefreshSessionRequest {}

// RefreshSessionResponse sets replacement secure cookies without exposing tokens to JavaScript.
message RefreshSessionResponse {}

// LogoutRequest uses only the secure access cookie.
message LogoutRequest {}

// LogoutResponse contains no session secrets.
message LogoutResponse {}

// LogoutAllRequest acts on the authenticated subject, never a caller-supplied subject ID.
message LogoutAllRequest {}

// LogoutAllResponse contains no session secrets.
message LogoutAllResponse {}

// AuthBrowserService bridges browser operations only on the gateway-out authenticated mTLS listener.
service AuthBrowserService {
  // RegisterCredentials delegates to the same public Auth handler and browser security policy.
  rpc BrowserRegisterCredentials(BrowserRegisterCredentialsRequest) returns (BrowserRegisterCredentialsResponse);
  // Login delegates to the same public Auth handler and browser security policy.
  rpc BrowserLogin(BrowserLoginRequest) returns (BrowserLoginResponse);
  // RefreshSession delegates to the same public Auth handler and browser security policy.
  rpc BrowserRefreshSession(BrowserRefreshSessionRequest) returns (BrowserRefreshSessionResponse);
  // Logout delegates to the same public Auth handler and browser security policy.
  rpc BrowserLogout(BrowserLogoutRequest) returns (BrowserLogoutResponse);
  // LogoutAll delegates to the same public Auth handler and browser security policy.
  rpc BrowserLogoutAll(BrowserLogoutAllRequest) returns (BrowserLogoutAllResponse);
  // BrowserStartLoginCodeChange applies the same public browser policy on the private listener.
  rpc BrowserStartLoginCodeChange(BrowserStartLoginCodeChangeRequest) returns (BrowserStartLoginCodeChangeResponse);
  // BrowserCompleteLoginCodeChange applies the same public browser policy on the private listener.
  rpc BrowserCompleteLoginCodeChange(BrowserCompleteLoginCodeChangeRequest) returns (BrowserCompleteLoginCodeChangeResponse);
  // BrowserChangePassword applies the same public browser policy on the private listener.
  rpc BrowserChangePassword(BrowserChangePasswordRequest) returns (BrowserChangePasswordResponse);
  // BrowserStartLogin applies the same public browser policy on the private listener.
  rpc BrowserStartLogin(BrowserStartLoginRequest) returns (BrowserStartLoginResponse);
  // BrowserCompleteLogin applies the same public browser policy on the private listener.
  rpc BrowserCompleteLogin(BrowserCompleteLoginRequest) returns (BrowserCompleteLoginResponse);
  // BrowserResendLoginCode applies the same public browser policy on the private listener.
  rpc BrowserResendLoginCode(BrowserResendLoginCodeRequest) returns (BrowserResendLoginCodeResponse);
  // BrowserRequestEmailVerification applies the same public browser policy on the private listener.
  rpc BrowserRequestEmailVerification(BrowserRequestEmailVerificationRequest) returns (BrowserRequestEmailVerificationResponse);
  // BrowserConfirmEmail applies the same public browser policy on the private listener.
  rpc BrowserConfirmEmail(BrowserConfirmEmailRequest) returns (BrowserConfirmEmailResponse);
  // BrowserRequestPasswordReset applies the same public browser policy on the private listener.
  rpc BrowserRequestPasswordReset(BrowserRequestPasswordResetRequest) returns (BrowserRequestPasswordResetResponse);
  // BrowserConfirmPasswordReset applies the same public browser policy on the private listener.
  rpc BrowserConfirmPasswordReset(BrowserConfirmPasswordResetRequest) returns (BrowserConfirmPasswordResetResponse);
  // BrowserGetCredentials applies the same public browser policy on the private listener.
  rpc BrowserGetCredentials(BrowserGetCredentialsRequest) returns (BrowserGetCredentialsResponse);
  // BrowserStartEmailChange applies the same public browser policy on the private listener.
  rpc BrowserStartEmailChange(BrowserStartEmailChangeRequest) returns (BrowserStartEmailChangeResponse);
  // BrowserConfirmEmailChange applies the same public browser policy on the private listener.
  rpc BrowserConfirmEmailChange(BrowserConfirmEmailChangeRequest) returns (BrowserConfirmEmailChangeResponse);
  // BrowserCancelEmailChange applies the same public browser policy on the private listener.
  rpc BrowserCancelEmailChange(BrowserCancelEmailChangeRequest) returns (BrowserCancelEmailChangeResponse);
  // BrowserListSessions applies the same public browser policy on the private listener.
  rpc BrowserListSessions(BrowserListSessionsRequest) returns (BrowserListSessionsResponse);
  // BrowserRevokeSession applies the same public browser policy on the private listener.
  rpc BrowserRevokeSession(BrowserRevokeSessionRequest) returns (BrowserRevokeSessionResponse);
  // BrowserRequestAccountDeletion applies the same public browser policy on the private listener.
  rpc BrowserRequestAccountDeletion(BrowserRequestAccountDeletionRequest) returns (BrowserRequestAccountDeletionResponse);
  // BrowserCancelAccountDeletion applies the same public browser policy on the private listener.
  rpc BrowserCancelAccountDeletion(BrowserCancelAccountDeletionRequest) returns (BrowserCancelAccountDeletionResponse);
}

// BrowserContext is private transport data, never a public request body or log payload.
// Values retain individual HTTP header lines, including duplicates; gateways do not parse cookies.
// Each field accepts at most 16 lines; cookie totals at most 8192 bytes, origin 2048,
// and sec_fetch_site 256. CR, LF and NUL are forbidden in all values.
message BrowserContext {
  // Cookie contains opaque Cookie header lines.
  repeated string cookie = 1;
  // Origin preserves duplicates so Auth can reject ambiguous origins.
  repeated string origin = 2;
  // SecFetchSite preserves fetch metadata for Auth's browser security policy.
  repeated string sec_fetch_site = 3;
}

// BrowserRegisterCredentialsRequest carries only typed Auth input and browser context.
message BrowserRegisterCredentialsRequest {
  // Request is the original public request without added token fields.
  RegisterCredentialsRequest request = 1;
  // Context is reconstructed exclusively from allowed browser headers.
  BrowserContext context = 2;
}

// BrowserRegisterCredentialsResponse is private and must be unwrapped before returning to a browser.
message BrowserRegisterCredentialsResponse {
  // Response is the original public response.
  RegisterCredentialsResponse response = 1;
  // SetCookie contains separate Auth-issued HTTP Set-Cookie lines; never serialize into a public body.
  repeated string set_cookie = 2;
  // Failure is a finite application rejection without any secret or arbitrary detail.
  AuthBrowserFailure failure = 3;
}

// BrowserLoginRequest carries only typed Auth input and browser context.
message BrowserLoginRequest {
  // Request is the original public request without added token fields.
  LoginRequest request = 1;
  // Context is reconstructed exclusively from allowed browser headers.
  BrowserContext context = 2;
}

// BrowserLoginResponse is private and must be unwrapped before returning to a browser.
message BrowserLoginResponse {
  // Response is the original public response.
  LoginResponse response = 1;
