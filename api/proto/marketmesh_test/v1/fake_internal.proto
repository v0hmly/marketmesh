syntax = "proto3";

package marketmesh_test.v1;

option go_package = "github.com/v0hmly/marketmesh/api/gen/go/e2e/v1;e2ev1";

// FakeInternalService is the bounded internal workload used only by tunnel E2E tests.
service FakeInternalService {
  // Read records one non-mutating request and returns the serving workload identity.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Mutate applies one idempotent mutation and reports whether it was already applied.
  rpc Mutate(MutateRequest) returns (MutateResponse);
  // Ledger returns a bounded metadata-only snapshot for E2E reconciliation.
  rpc Ledger(LedgerRequest) returns (LedgerResponse);
}

// ReadRequest carries an opaque E2E request identifier and no user payload.
message ReadRequest {
  // RequestId is a 16-byte identifier generated by the E2E caller.
  bytes request_id = 1;
}

// ReadResponse identifies the workload instance that handled a read.
message ReadResponse {
  // InstanceId is the configured low-sensitivity workload instance name.
  string instance_id = 1;
  // Sequence is the monotonic per-instance ledger position.
  uint64 sequence = 2;
}

// MutateRequest carries an opaque E2E request identifier and no user payload.
message MutateRequest {
  // RequestId is a 16-byte identifier generated by the E2E caller.
  bytes request_id = 1;
}

// MutateResponse describes the idempotent mutation outcome.
message MutateResponse {
  // InstanceId is the configured low-sensitivity workload instance name.
  string instance_id = 1;
  // Sequence is the original mutation's per-instance ledger position.
  uint64 sequence = 2;
  // Duplicate is true when the idempotency key was already applied by this instance.
  bool duplicate = 3;
}

// LedgerRequest selects a bounded suffix of the in-memory ledger.
message LedgerRequest {
  // Limit must be positive and no greater than the server's configured maximum.
  uint32 limit = 1;
}

// LedgerResponse contains metadata only; request payloads and raw idempotency keys are absent.
message LedgerResponse {
  // InstanceId is the configured low-sensitivity workload instance name.
  string instance_id = 1;
  // Entries are ordered by ascending sequence.
  repeated LedgerEntry entries = 2;
}

// LedgerEntry is one metadata-only request observation.
message LedgerEntry {
  // Sequence is the monotonic per-instance ledger position.
  uint64 sequence = 1;
  // Operation distinguishes read and mutating calls without exposing a full method name.
  Operation operation = 2;
  // RequestId is the 16-byte E2E request identifier.
  bytes request_id = 3;
  // IdempotencyKeySha256 is populated only for mutations and never contains the raw key.
  bytes idempotency_key_sha256 = 4;
  // Attempts counts calls observed for the same mutation key on this instance.
  uint32 attempts = 5;
}

// Operation is the finite fake-internal operation set.
enum Operation {
  // OPERATION_UNSPECIFIED is rejected by the fake workload.
  OPERATION_UNSPECIFIED = 0;
  // OPERATION_READ denotes a non-mutating request.
  OPERATION_READ = 1;
  // OPERATION_MUTATE denotes an idempotent mutation.
  OPERATION_MUTATE = 2;
}
