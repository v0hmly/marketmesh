<!-- В продукте .dialog-scrim фиксирован на весь экран; здесь он ограничен карточкой. -->
<div class="dialog-scrim" style="position:relative;inset:auto;min-height:400px">
  <div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <h2 id="d-title">Удалить несохранённые изменения?</h2>
    <p>Сохранённые данные останутся прежними. Введённые изменения будут потеряны.</p>
    <div class="dialog-actions">
      <button class="button text-button" type="button">Продолжить редактирование</button>
      <button class="button primary" type="button">Удалить черновик</button>
    </div>
  </div>
</div>
