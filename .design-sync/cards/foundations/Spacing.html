<!-- group: Основы; viewport: 960x620 -->
<section class="card" style="padding:var(--sp-7);display:grid;gap:var(--sp-6)">
  <div>
    <h2>Отступы, радиусы, тень</h2>
    <p class="subtle">Шкала отступов — только эти шаги. Одна тень — у карточек.</p>
  </div>
  <div style="display:grid;gap:var(--sp-2)">
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-1</code><div style="height:12px;width:var(--sp-1);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-2</code><div style="height:12px;width:var(--sp-2);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-3</code><div style="height:12px;width:var(--sp-3);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-4</code><div style="height:12px;width:var(--sp-4);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-5</code><div style="height:12px;width:var(--sp-5);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-6</code><div style="height:12px;width:var(--sp-6);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-7</code><div style="height:12px;width:var(--sp-7);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-8</code><div style="height:12px;width:var(--sp-8);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-9</code><div style="height:12px;width:var(--sp-9);background:var(--action-primary);border-radius:2px"></div></div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)"><code style="width:72px;font-size:var(--text-caption-size)">--sp-10</code><div style="height:12px;width:var(--sp-10);background:var(--action-primary);border-radius:2px"></div></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--sp-5)">
    <div style="width:96px;height:64px;border:1px solid var(--border-control);border-radius:var(--r-xs);display:grid;place-items:center;font-size:var(--text-caption-size)">--r-xs</div>
    <div style="width:96px;height:64px;border:1px solid var(--border-control);border-radius:var(--r-sm);display:grid;place-items:center;font-size:var(--text-caption-size)">--r-sm</div>
    <div style="width:96px;height:64px;border:1px solid var(--border-control);border-radius:var(--r-md);display:grid;place-items:center;font-size:var(--text-caption-size)">--r-md</div>
    <div style="width:96px;height:64px;border:1px solid var(--border-control);border-radius:var(--r-lg);display:grid;place-items:center;font-size:var(--text-caption-size)">--r-lg</div>
    <div style="width:96px;height:64px;border:1px solid var(--border-control);border-radius:var(--r-pill);display:grid;place-items:center;font-size:var(--text-caption-size)">--r-pill</div>
    <div style="width:96px;height:64px;border-radius:var(--r-lg);background:var(--surface-raised);box-shadow:var(--elevation-card);display:grid;place-items:center;font-size:var(--text-caption-size)">--elevation-card</div>
  </div>
</section>
