name: marketmesh

x-postgres-common: &postgres-common
  image: postgres:18.6-bookworm
  restart: unless-stopped
  shm_size: 128mb
  environment: &postgres-environment
    PGDATA: /var/lib/postgresql/18/docker
    POSTGRES_DB: marketmesh
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run task infra:up to create infra/compose/.env}
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M

x-redis-common: &redis-common
  image: redis:8.10.1-alpine3.23
  restart: unless-stopped
  command:
    - /bin/sh
    - -ceu
    - |-
      printf 'requirepass "%s"\n' "$${REDIS_PASSWORD}" > /tmp/marketmesh-redis.conf
      exec redis-server /tmp/marketmesh-redis.conf \
        --appendonly yes \
        --appendfsync everysec \
        --save 60 1
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 128M

x-seaweed-common: &seaweed-common
  image: chrislusf/seaweedfs:4.41
  restart: unless-stopped
  command:
    - mini
    - -dir=/data
    - -ip.bind=0.0.0.0
    - -master.volumeSizeLimitMB=256
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "/usr/bin/weed", "version"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 384M

x-observability-logging: &observability-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-alloy-common: &alloy-common
  image: grafana/alloy:v1.19.2
  restart: unless-stopped
  command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.alloy
  volumes:
    - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
    - /var/lib/alloy:size=16m,mode=0755
  security_opt:
    - no-new-privileges:true
  logging: *observability-logging
  healthcheck:
    test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
    interval: 30s
    timeout: 5s
    retries: 12
    start_period: 10s
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 160M

services:
  observability-init:
    image: alpine:3.23.5
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ceu
      - chown 10001:10001 /var/tempo /var/loki
    volumes:
      - tempo-data:/var/tempo
      - loki-data:/var/loki
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging: *observability-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M

  postgres-primary:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      APP_RW_PASSWORD: ${POSTGRES_APP_RW_PASSWORD:?missing POSTGRES_APP_RW_PASSWORD}
      APP_RO_PASSWORD: ${POSTGRES_APP_RO_PASSWORD:?missing POSTGRES_APP_RO_PASSWORD}
      REPLICATOR_PASSWORD: ${POSTGRES_REPLICATOR_PASSWORD:?missing POSTGRES_REPLICATOR_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=6
      - -c
      - max_replication_slots=6
      - -c
      - max_slot_wal_keep_size=512MB
      - -c
      - wal_keep_size=128MB
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - postgres-primary-data:/var/lib/postgresql
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-marketmesh.sh:ro
    networks:
      internal:
        aliases:
          - postgres-rw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-sync:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      PRIMARY_HOST: postgres-rw
      REPLICA_APPLICATION_NAME: postgres_sync
      REPLICATION_SLOT: postgres_sync_slot
      REPLICATOR_PASSWORD: ${POSTGRES_REPLICATOR_PASSWORD:?missing POSTGRES_REPLICATOR_PASSWORD}
    entrypoint: ["/usr/local/bin/replica-entrypoint"]
    command: ["postgres", "-c", "hot_standby=on"]
    volumes:
      - postgres-sync-data:/var/lib/postgresql
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint:ro
    networks:
      internal:
        aliases:
          - postgres-ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" &&
          test "$$(psql --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --tuples-only --no-align --command 'SELECT pg_is_in_recovery()')" = t
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres-async:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      PRIMARY_HOST: postgres-rw
      REPLICA_APPLICATION_NAME: postgres_async
      REPLICATION_SLOT: postgres_async_slot
      REPLICATOR_PASSWORD: ${POSTGRES_REPLICATOR_PASSWORD:?missing POSTGRES_REPLICATOR_PASSWORD}
    entrypoint: ["/usr/local/bin/replica-entrypoint"]
    command: ["postgres", "-c", "hot_standby=on"]
    volumes:
      - postgres-async-data:/var/lib/postgresql
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint:ro
    networks:
      - internal
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" &&
          test "$$(psql --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --tuples-only --no-align --command 'SELECT pg_is_in_recovery()')" = t
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis-edge:
    <<: *redis-common
    environment:
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:?missing REDIS_EDGE_PASSWORD}
    volumes:
      - redis-edge-data:/data
    networks:
      dmz:
        aliases:
          - edge-state
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --no-auth-warning ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20

  redis-auth:
    <<: *redis-common
    environment:
      REDIS_PASSWORD: ${REDIS_AUTH_PASSWORD:?missing REDIS_AUTH_PASSWORD}
    volumes:
      - redis-auth-data:/data
    networks:
      internal:
        aliases:
          - auth-state
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --no-auth-warning ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20

  seaweed-quarantine:
    <<: *seaweed-common
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_QUARANTINE_ACCESS_KEY:?missing SEAWEED_QUARANTINE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_QUARANTINE_SECRET_KEY:?missing SEAWEED_QUARANTINE_SECRET_KEY}
      S3_BUCKET: quarantine
    volumes:
      - seaweed-quarantine-data:/data
    networks:
      dmz:
        aliases:
          - object-quarantine

  seaweed-public:
    <<: *seaweed-common
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_PUBLIC_ACCESS_KEY:?missing SEAWEED_PUBLIC_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_PUBLIC_SECRET_KEY:?missing SEAWEED_PUBLIC_SECRET_KEY}
      S3_BUCKET: public
    volumes:
      - seaweed-public-data:/data
    networks:
      dmz:
        aliases:
          - object-public

  seaweed-internal:
    <<: *seaweed-common
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_INTERNAL_ACCESS_KEY:?missing SEAWEED_INTERNAL_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_INTERNAL_SECRET_KEY:?missing SEAWEED_INTERNAL_SECRET_KEY}
      S3_BUCKET: source,processed
    volumes:
      - seaweed-internal-data:/data
    networks:
      internal:
        aliases:
          - object-internal

  alloy-dmz:
    <<: *alloy-common
    networks:
      dmz:
        aliases:
          - otel-collector
      observability:

  alloy-internal:
    <<: *alloy-common
    networks:
      internal:
        aliases:
          - otel-collector
      observability:

  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    depends_on:
      observability-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *observability-logging
    healthcheck:
      test: ["CMD", "/tempo", "-config.file=/etc/tempo/tempo.yml", "-config.verify=true"]
      interval: 30s
      timeout: 5s
      retries: 18
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/var/loki
    networks:
      - observability
    depends_on:
      observability-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *observability-logging
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yml", "-verify-config"]
      interval: 30s
      timeout: 5s
      retries: 18
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *observability-logging
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M

  observability-gateway:
    image: haproxy:3.2.23-alpine3.24
    restart: unless-stopped
    user: haproxy
    command:
      - haproxy
      - -W
      - -db
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - ./haproxy/observability.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${OTLP_DMZ_GRPC_PORT:-14317}:14317"
      - "127.0.0.1:${OTLP_DMZ_HTTP_PORT:-14318}:14318"
      - "127.0.0.1:${OTLP_INTERNAL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_INTERNAL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
      - "127.0.0.1:${LOKI_HTTP_PORT:-3100}:3100"
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    networks:
      - observability
      - observability-access
    depends_on:
      alloy-dmz:
        condition: service_healthy
      alloy-internal:
        condition: service_healthy
      grafana:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/lib/haproxy:size=8m,mode=0755
      - /var/run:size=4m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *observability-logging
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 96M

  postgres-check:
    image: postgres:18.6-bookworm
    profiles: ["checks"]
    environment:
      PGDATABASE: marketmesh
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?missing POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_RW_PASSWORD: ${POSTGRES_APP_RW_PASSWORD:?missing POSTGRES_APP_RW_PASSWORD}
      POSTGRES_APP_RO_PASSWORD: ${POSTGRES_APP_RO_PASSWORD:?missing POSTGRES_APP_RO_PASSWORD}
    entrypoint: ["/bin/bash", "/checks/postgres-smoke.sh"]
    volumes:
      - ./checks/postgres-smoke.sh:/checks/postgres-smoke.sh:ro
    networks:
      - internal
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-sync:
        condition: service_healthy
      postgres-async:
        condition: service_healthy

  dmz-probe:
    image: alpine:3.23.5
    profiles: ["checks"]
    entrypoint: ["/bin/sh", "/checks/dmz-network.sh"]
    volumes:
      - ./checks/dmz-network.sh:/checks/dmz-network.sh:ro
    networks:
      - dmz
    depends_on:
      redis-edge:
        condition: service_healthy
      seaweed-quarantine:
        condition: service_healthy
      seaweed-public:
        condition: service_healthy
      alloy-dmz:
        condition: service_healthy

networks:
  dmz:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-dmz
    internal: true
  internal:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-internal
    internal: true
  observability:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-observability
    internal: true
  observability-access:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-observability-access

volumes:
  postgres-primary-data:
  postgres-sync-data:
  postgres-async-data:
  redis-edge-data:
  redis-auth-data:
  seaweed-quarantine-data:
  seaweed-public-data:
  seaweed-internal-data:
  tempo-data:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-tempo-data
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-loki-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-marketmesh}-grafana-data
