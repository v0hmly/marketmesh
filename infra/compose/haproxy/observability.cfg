global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 5m
  timeout server 5m
  timeout tunnel 1h

frontend fe_otlp_internal_grpc
  bind :4317
  default_backend be_alloy_internal_grpc

backend be_alloy_internal_grpc
  server alloy_internal alloy-internal:4317 check

frontend fe_otlp_internal_http
  bind :4318
  default_backend be_alloy_internal_http

backend be_alloy_internal_http
  server alloy_internal alloy-internal:4318 check

frontend fe_otlp_dmz_grpc
  bind :14317
  default_backend be_alloy_dmz_grpc

backend be_alloy_dmz_grpc
  server alloy_dmz alloy-dmz:4317 check

frontend fe_otlp_dmz_http
  bind :14318
  default_backend be_alloy_dmz_http

backend be_alloy_dmz_http
  server alloy_dmz alloy-dmz:4318 check

frontend fe_tempo_http
  bind :3200
  default_backend be_tempo_http

backend be_tempo_http
  server tempo tempo:3200 check

frontend fe_loki_http
  bind :3100
  default_backend be_loki_http

backend be_loki_http
  server loki loki:3100 check

frontend fe_grafana_http
  bind :3000
  default_backend be_grafana_http

backend be_grafana_http
  server grafana grafana:3000 check
