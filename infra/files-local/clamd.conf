# Парсер не имеет сети или секретов. Только Unix INSTREAM, один scan одновременно.
Foreground yes
LocalSocket /run/files-clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /signatures
TemporaryDirectory /work
MaxThreads 1
MaxQueue 2
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 120000
StreamMaxLength 100M
MaxFileSize 600M
MaxScanSize 1024M
MaxRecursion 16
MaxFiles 8192
MaxScanTime 120000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
DetectPUA yes
FailIfCvdOlderThan 2
LogTime no
LogClean no
LogVerbose no

# Выше собственных пределов ZIP (512M), XML (8M) и входа (100M).
# AlertExceedsMax не покрывает PCREMaxFileSize и некоторые ZIP paths (#633/#1785).
PCREMaxFileSize 600M
MaxEmbeddedPE 600M
MaxHTMLNormalize 600M
MaxHTMLNoTags 600M
MaxScriptNormalize 600M
MaxZipTypeRcg 100M
