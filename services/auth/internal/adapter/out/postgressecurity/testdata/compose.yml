services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auth_security_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username auth_test --dbname auth_security_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [auth-security-test]
networks:
  auth-security-test: {}
