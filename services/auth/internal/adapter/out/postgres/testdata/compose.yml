services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username auth_test --dbname auth"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - auth-integration

  auth-postgres-integration:
    build:
      context: ../../../../../../..
      dockerfile: services/auth/internal/adapter/out/postgres/testdata/Dockerfile
    environment:
      MARKETMESH_AUTH_POSTGRES_DSN: postgres://auth_test:auth_test_password@postgres:5432/auth?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-integration

networks:
  auth-integration:
    internal: true
