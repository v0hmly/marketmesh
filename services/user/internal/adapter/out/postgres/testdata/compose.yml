services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: user_test_password
    command:
      - bash
      - -ec
      - |
        printf 'local all all trust\nhost all all all scram-sha-256\nhost replication user_test all scram-sha-256\n' > /tmp/user-pg-hba.conf
        exec docker-entrypoint.sh postgres -c hba_file=/tmp/user-pg-hba.conf -c wal_level=replica -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username user_test --dbname users"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - user-integration

  postgres-ro:
    image: postgres:18.6-bookworm
    environment:
      PGPASSWORD: user_test_password
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/18/replica
        gosu postgres pg_basebackup -h postgres -U user_test -D /var/lib/postgresql/18/replica -R -X stream
        exec gosu postgres postgres -D /var/lib/postgresql/18/replica
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U user_test -d users -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - user-integration

  user-postgres-integration:
    build:
      context: ../../../../../../..
      dockerfile: services/user/internal/adapter/out/postgres/testdata/Dockerfile
    environment:
      MARKETMESH_USER_POSTGRES_RO_DSN: postgres://user_test:user_test_password@postgres-ro:5432/users?sslmode=disable
      MARKETMESH_USER_POSTGRES_DSN: postgres://user_test:user_test_password@postgres:5432/users?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ro:
        condition: service_healthy
    networks:
      - user-integration

networks:
  user-integration:
    internal: true
